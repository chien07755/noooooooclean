<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宿舍打掃輪值表 (雲端同步版)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            customBg: '#FFFDF9',
            cardBg: '#FFF9ED',
            cardBorder: '#2D2D2D',
            btnYellow: '#FFD43B',
            btnGreen: '#51CF66',
            btnGray: '#F1F3F5',
            textMain: '#2D2D2D',
            badgeRed: '#FF6B6B'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-customBg text-textMain min-h-screen flex flex-col items-center py-6 px-4 font-sans select-none">

  <!-- App Container -->
  <div class="w-full max-w-md bg-white border-2 border-cardBorder rounded-3xl shadow-[4px_4px_0px_#2D2D2D] p-5 flex flex-col gap-5">
    
    <!-- Header -->
    <div class="flex items-center justify-between border-b-2 border-cardBorder pb-4">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🧹</span>
        <h1 class="text-xl font-black tracking-wide text-textMain">宿舍打掃輪值</h1>
      </div>
      <div class="flex items-center gap-2">
        <!-- 鈴鐺按鈕 (帶紅點，點擊開啓通知彈窗) -->
        <button id="bell-btn" onclick="openInfoModal()" class="relative w-11 h-11 bg-[#FFFDF9] border-2 border-cardBorder rounded-2xl flex items-center justify-center shadow-[2px_2px_0px_#2D2D2D] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all">
          <svg class="w-5 h-5 text-textMain" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
          <span class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-badgeRed border-2 border-cardBorder rounded-full"></span>
        </button>
        <!-- 雲端連線狀態指示燈 -->
        <div id="sync-status" class="px-3 py-1.5 bg-cardBg border-2 border-cardBorder rounded-2xl text-xs font-bold flex items-center gap-1.5 shadow-[2px_2px_0px_#2D2D2D]">
          <span id="sync-dot" class="w-2.5 h-2.5 rounded-full bg-yellow-400 animate-pulse"></span>
          <span id="sync-text">連線中...</span>
        </div>
      </div>
    </div>

    <!-- Week Selector & Week Info -->
    <div class="flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <button onclick="changeWeek(-1)" class="px-3 py-1.5 bg-cardBg border-2 border-cardBorder rounded-xl font-bold text-sm shadow-[2px_2px_0px_#2D2D2D] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all">◀ 上週</button>
        <span id="current-week-label" class="font-black text-base text-textMain">載入中...</span>
        <button onclick="changeWeek(1)" class="px-3 py-1.5 bg-cardBg border-2 border-cardBorder rounded-xl font-bold text-sm shadow-[2px_2px_0px_#2D2D2D] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all">下週 ▶</button>
      </div>
    </div>

    <!-- Rotation Cards Container -->
    <div id="rotation-container" class="flex flex-col gap-4">
      <!-- 動態產生三位負責人的卡片 -->
    </div>

  </div>

  <!-- 點擊大圖與上傳/刪除檢查 Modal -->
  <div id="photo-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white border-2 border-cardBorder rounded-3xl w-full max-w-sm p-5 shadow-[6px_6px_0px_#2D2D2D] flex flex-col gap-4">
      <div class="flex items-center justify-between border-b-2 border-cardBorder pb-3">
        <h3 id="modal-title" class="font-black text-lg">打卡照片檢查</h3>
        <button onclick="closePhotoModal()" class="w-8 h-8 bg-cardBg border-2 border-cardBorder rounded-xl flex items-center justify-center font-bold shadow-[2px_2px_0px_#2D2D2D]">✕</button>
      </div>
      <div class="flex flex-col items-center justify-center gap-3">
        <img id="modal-img" src="" alt="打卡照" class="w-full h-64 object-cover border-2 border-cardBorder rounded-2xl">
      </div>
      <div class="flex flex-col gap-2 mt-2">
        <button onclick="deleteCurrentPhoto()" class="w-full py-3 bg-red-100 hover:bg-red-200 border-2 border-cardBorder rounded-2xl font-black text-red-600 shadow-[3px_3px_0px_#2D2D2D] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all">
          🗑️ 取消這次打卡 (重新拍照)
        </button>
        <button onclick="closePhotoModal()" class="w-full py-3 bg-btnYellow border-2 border-cardBorder rounded-2xl font-black shadow-[3px_3px_0px_#2D2D2D] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all">
          關閉視窗
        </button>
      </div>
    </div>
  </div>

  <!-- 通知與排班資訊 Modal -->
  <div id="info-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white border-2 border-cardBorder rounded-3xl w-full max-w-sm p-5 shadow-[6px_6px_0px_#2D2D2D] flex flex-col gap-4">
      <div class="flex items-center justify-between border-b-2 border-cardBorder pb-3">
        <h3 class="font-black text-lg">🔔 輪值與提醒公告</h3>
        <button onclick="closeInfoModal()" class="w-8 h-8 bg-cardBg border-2 border-cardBorder rounded-xl flex items-center justify-center font-bold shadow-[2px_2px_0px_#2D2D2D]">✕</button>
      </div>
      <div class="flex flex-col gap-3 text-sm font-medium text-gray-700 leading-relaxed">
        <div class="p-3 bg-cardBg border-2 border-cardBorder rounded-2xl">
          <p class="font-black text-textMain mb-1">📌 本週打掃叮嚀：</p>
          <p>請各負責人於每週日晚上 12 點前完成打掃並拍照打卡上傳！雲端會即時同步三人的進度喔～</p>
        </div>
        <div class="p-3 bg-amber-50 border-2 border-cardBorder rounded-2xl">
          <p class="font-black text-textMain mb-1">✨ 輪值順序規則：</p>
          <p>每週自動輪換區域：公共區域、衛浴、廚房。</p>
        </div>
      </div>
      <button onclick="closeInfoModal()" class="w-full py-3 bg-btnYellow border-2 border-cardBorder rounded-2xl font-black shadow-[3px_3px_0px_#2D2D2D] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all">
        知道了
      </button>
    </div>
  </div>

  <!-- 隱藏的檔案上傳 input -->
  <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="handleFileSelected(event)">

  <!-- Firebase SDKs & App Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // 妳的 Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyCufOh9uMVSEo9qJoxtXZ9UczmslTDkEmo",
      authDomain: "nocleannolife.firebaseapp.com",
      projectId: "nocleannolife",
      storageBucket: "nocleannolife.firebasestorage.app",
      messagingSenderId: "387560881650",
      appId: "1:387560881650:web:a34bffd0335b4f0f173f6b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 成員名單與固定區域
    const members = [
      { name: "嫻", area: "公共區域 (客廳/走廊)" },
      { name: "綾", area: "衛浴設備" },
      { name: "茜", area: "廚房與垃圾" }
    ];

    let currentWeekOffset = 0;
    let cleaningData = {};
    let activeTargetMember = null;
    let unsubscribe = null;

    // 計算當前是第幾週 (以 2026-01-04 為基準週)
    function getWeekKey(offset) {
      const now = new Date();
      now.setDate(now.getDate() + (offset * 7));
      const startOfYear = new Date(now.getFullYear(), 0, 1);
      const weekNum = Math.ceil(((now - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);
      return `${now.getFullYear()}-W${weekNum}`;
    }

    window.changeWeek = function(direction) {
      currentWeekOffset += direction;
      setupFirebaseListener();
    }

    function setupFirebaseListener() {
      const weekKey = getWeekKey(currentWeekOffset);
      document.getElementById('current-week-label').innerText = `📅 ${weekKey} 輪值表`;

      if (unsubscribe) unsubscribe();

      const docRef = doc(db, "cleaning_weeks", weekKey);
      
      document.getElementById('sync-dotclassName').className = "w-2.5 h-2.5 rounded-full bg-yellow-400 animate-pulse";
      document.getElementById('sync-text').innerText = "同步中...";

      unsubscribe = onSnapshot(docRef, (docSnap) => {
        document.getElementById('sync-dot').className = "w-2.5 h-2.5 rounded-full bg-green-500";
        document.getElementById('sync-text').innerText = "雲端同步中";

        if (docSnap.exists()) {
          cleaningData = docSnap.data();
        } else {
          cleaningData = {};
        }
        renderApp();
      }, (error) => {
        console.error("Firebase Sync Error:", error);
        document.getElementById('sync-dot').className = "w-2.5 h-2.5 rounded-full bg-red-500";
        document.getElementById('sync-text').innerText = "連線異常";
      });
    }

    async function saveToFirebase() {
      const weekKey = getWeekKey(currentWeekOffset);
      const docRef = doc(db, "cleaning_weeks", weekKey);
      try {
        await setDoc(docRef, cleaningData);
      } catch (e) {
        console.error("Error saving to Firestore: ", e);
      }
    }

    function renderApp() {
      const container = document.getElementById('rotation-container');
      container.innerHTML = '';

      // 計算每週旋轉順序
      const rotatedMembers = members.map((m, idx) => {
        const shiftedIdx = (idx - (currentWeekOffset % 3) + 300) % 3;
        return {
          ...members[shiftedIdx],
          originalArea: m.area
        };
      });

      rotatedMembers.forEach((m, index) => {
        const memberData = cleaningData[m.name] || { tasks: [false, false, false], photo: null };
        const isCompleted = memberData.tasks.every(t => t);

        const cardHTML = `
          <div class="bg-cardBg border-2 border-cardBorder rounded-2xl p-4 flex flex-col gap-3 shadow-[3px_3px_0px_#2D2D2D]">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="w-8 h-8 bg-white border-2 border-cardBorder rounded-xl flex items-center justify-center font-black text-sm shadow-[2px_2px_0px_#2D2D2D]">${m.name}</span>
                <span class="font-black text-base text-textMain">${m.originalArea}</span>
              </div>
              <span class="px-2.5 py-1 text-xs font-black border-2 border-cardBorder rounded-xl shadow-[1px_1px_0px_#2D2D2D] ${isCompleted ? 'bg-btnGreen text-white' : 'bg-amber-100 text-textMain'}">
                ${isCompleted ? '✨ 已完成打掃' : '⏳ 進行中'}
              </span>
            </div>

            <div class="flex flex-col gap-2 bg-white border-2 border-cardBorder rounded-xl p-3">
              <label class="flex items-center gap-2.5 cursor-pointer font-medium text-sm">
                <input type="checkbox" class="w-4 h-4 accent-black rounded cursor-pointer" ${memberData.tasks[0] ? 'checked' : ''} onchange="toggleTask('${m.name}', 0)">
                <span>地面清潔與垃圾清理</span>
              </label>
              <label class="flex items-center gap-2.5 cursor-pointer font-medium text-sm">
                <input type="checkbox" class="w-4 h-4 accent-black rounded cursor-pointer" ${memberData.tasks[1] ? 'checked' : ''} onchange="toggleTask('${m.name}', 1)">
                <span>桌面與檯面擦拭</span>
              </label>
              <label class="flex items-center gap-2.5 cursor-pointer font-medium text-sm">
                <input type="checkbox" class="w-4 h-4 accent-black rounded cursor-pointer" ${memberData.tasks[2] ? 'checked' : ''} onchange="toggleTask('${m.name}', 2)">
                <span>物品歸位與整齊擺放</span>
              </label>
            </div>

            <div class="flex items-center justify-between pt-1">
              ${memberData.photo ? `
                <div class="relative cursor-pointer" onclick="openPhotoModal('${m.name}')">
                  <img src="${memberData.photo}" class="w-14 h-14 object-cover border-2 border-cardBorder rounded-xl shadow-[2px_2px_0px_#2D2D2D]">
                  <span class="absolute -bottom-1 -right-1 bg-btnGreen text-white text-[10px] px-1 rounded border border-cardBorder font-bold">✓</span>
                </div>
              ` : `
                <span class="text-xs font-bold text-gray-400">尚未上傳打卡照</span>
              `}
              <button onclick="triggerCamera('${m.name}')" class="px-4 py-2 bg-btnYellow border-2 border-cardBorder rounded-xl font-black text-sm shadow-[2px_2px_0px_#2D2D2D] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all">
                📸 ${memberData.photo ? '重新拍照' : '拍照打卡'}
              </button>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHTML);
      });
    }

    window.toggleTask = function(memberName, taskIndex) {
      if (!cleaningData[memberName]) {
        cleaningData[memberName] = { tasks: [false, false, false], photo: null };
      }
      cleaningData[memberName].tasks[taskIndex] = !cleaningData[memberName].tasks[taskIndex];
      saveToFirebase();
    }

    window.triggerCamera = function(memberName) {
      activeTargetMember = memberName;
      document.getElementById('camera-input').click();
    }

    window.handleFileSelected = function(event) {
      const file = event.target.files[0];
      if (!file || !activeTargetMember) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600;
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);

          if (!cleaningData[activeTargetMember]) {
            cleaningData[activeTargetMember] = { tasks: [false, false, false], photo: null };
          }
          cleaningData[activeTargetMember].photo = compressedDataUrl;
          saveToFirebase();
          event.target.value = '';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    window.openPhotoModal = function(memberName) {
      activeTargetMember = memberName;
      const memberData = cleaningData[memberName];
      if (memberData && memberData.photo) {
        document.getElementById('modal-title').innerText = `${memberName} 的打卡照片`;
        document.getElementById('modal-img').src = memberData.photo;
        document.getElementById('photo-modal').classList.remove('hidden');
      }
    }

    window.closePhotoModal = function() {
      document.getElementById('photo-modal').classList.add('hidden');
    }

    window.deleteCurrentPhoto = function() {
      if (activeTargetMember && cleaningData[activeTargetMember]) {
        cleaningData[activeTargetMember].photo = null;
        saveToFirebase();
        closePhotoModal();
      }
    }

    window.openInfoModal = function() {
      document.getElementById('info-modal').classList.remove('hidden');
    }

    window.closeInfoModal = function() {
      document.getElementById('info-modal').classList.add('hidden');
    }

    // 啟動監聽
    setupFirebaseListener();
  </script>
</body>
</html>
